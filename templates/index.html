<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phân tích Cảm xúc Sinh viên (AI Dashboard)</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f8f9fa;
        }

        .result-card {
            transition: all 0.3s;
            border-left: 5px solid gray;
        }

        .card-positive {
            border-left-color: #198754;
            background-color: #f0fff4;
        }

        .card-negative {
            border-left-color: #dc3545;
            background-color: #fff5f5;
        }

        .card-neutral {
            border-left-color: #6c757d;
        }

        .highlight-word {
            font-weight: bold;
            padding: 2px 5px;
            border-radius: 4px;
            color: white;
        }

        .loading {
            display: none;
        }
    </style>
</head>

<body>

    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="display-5 fw-bold text-primary">🎓 Student Feedback Analysis</h1>
            <p class="lead text-muted">Hệ thống phân tích cảm xúc & trích xuất từ khóa bằng PhoBERT + LIME</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm mb-4">
                    <div class="card-body">
                        <label for="inputText" class="form-label fw-bold">Nhập feedback của sinh viên:</label>
                        <textarea class="form-control" id="inputText" rows="4"
                            placeholder="Ví dụ: Môn này thầy dạy rất hay nhưng phòng học nóng quá..."></textarea>
                        <div class="form-text">Có thể nhập nhiều câu, mỗi câu một dòng.</div>

                        <button onclick="analyze()" class="btn btn-primary mt-3 w-100 fw-bold">
                            🚀 Phân tích ngay
                        </button>
                    </div>
                </div>

                <div id="loading" class="text-center loading my-4">
                    <div class="spinner-border text-primary" role="status"></div>
                    <p class="mt-2">AI đang suy nghĩ & giải thích lý do...</p>
                </div>

                <div id="resultArea"></div>
            </div>
        </div>
    </div>

    <script>
        async function analyze() {
            const textInput = document.getElementById('inputText').value;
            if (!textInput.trim()) {
                alert("Vui lòng nhập nội dung!");
                return;
            }

            // Tách các dòng thành mảng để gửi lên API
            const textArray = textInput.split('\n').filter(line => line.trim() !== "");

            // Hiển thị loading
            document.getElementById('loading').style.display = 'block';
            document.getElementById('resultArea').innerHTML = '';

            try {
                const response = await fetch('/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: textArray })
                });

                const data = await response.json();
                renderResults(data.results);
            } catch (error) {
                alert("Lỗi kết nối server: " + error);
            } finally {
                document.getElementById('loading').style.display = 'none';
            }
        }

        function renderResults(results) {
            const resultArea = document.getElementById('resultArea');

            results.forEach(item => {
                // Xác định màu sắc dựa trên cảm xúc
                let colorClass = 'card-neutral';
                let badgeClass = 'bg-secondary';
                if (item.sentiment === 'Tích cực') {
                    colorClass = 'card-positive';
                    badgeClass = 'bg-success';
                } else if (item.sentiment === 'Tiêu cực') {
                    colorClass = 'card-negative';
                    badgeClass = 'bg-danger';
                }

                // Tạo HTML cho các từ khóa (Key Factors)
                let keywordsHtml = '';
                if (item.key_factors && item.key_factors.length > 0) {
                    keywordsHtml = '<div class="mt-2"><small class="text-muted">Từ khóa quyết định:</small><br>';
                    item.key_factors.forEach(k => {
                        keywordsHtml += `<span class="badge ${badgeClass} me-1" title="Độ quan trọng: ${k.importance}">${k.word}</span>`;
                    });
                    keywordsHtml += '</div>';
                }

                // Template thẻ kết quả
                const cardHtml = `
                <div class="card result-card ${colorClass} mb-3 shadow-sm">
                    <div class="card-body">
                        <div class="d-flex justify-content-between align-items-center mb-2">
                            <span class="badge ${badgeClass} fs-6">${item.sentiment}</span>
                            <span class="text-muted small">Độ tin cậy: <strong>${item.confidence_score}</strong></span>
                        </div>
                        <p class="card-text fs-5 mb-1">"${item.input_text}"</p>
                        ${keywordsHtml}
                    </div>
                </div>
            `;
                resultArea.innerHTML += cardHtml;
            });
        }
    </script>

</body>

</html>
